<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberAkademia</title>
  <meta name="description" content="Cyberbezpieczeństwo w organizacji w trzech warstwach: regulacje, organizacja, technologia. Materiał do nauki w języku polskim." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <style>
    /* Boot gate: keep the page hidden until the app has rendered its first view,
       so the empty shell is never painted. */
    html:not(.app-ready) body { visibility: hidden; }
  </style>
  <!-- Failsafe reveal after 4 s if the app never starts (a timer, not a CSS
       animation, so the reduced-motion reset cannot cancel it) -->
  <script>setTimeout(function () { document.documentElement.classList.add('app-ready'); }, 4000);</script>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/quantica.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/blocks.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body data-route="start" data-layer="base">
  <noscript><style>html:not(.app-ready) body { visibility: visible; }</style>
    <p>CyberAkademia wymaga włączonego JavaScriptu.</p></noscript>
  <a class="skip-link" href="#app">Przejdź do treści</a>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Nawigacja kursu"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="page">
        <main id="app" tabindex="-1"></main>
        <nav class="toc" id="toc" aria-label="Na tej stronie" hidden></nav>
      </div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="help" id="help" role="dialog" aria-modal="true" aria-labelledby="help-title" aria-hidden="true"></div>
  <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>
  <div id="tooltip" class="tooltip-box" role="tooltip" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
